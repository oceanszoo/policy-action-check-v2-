[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-action-check"
version = "0.8.0"
description = "Policy or terms -> a no-model action-code generator and judge bundle"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/policy-action-check/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
