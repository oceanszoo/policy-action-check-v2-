name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
      - name: Reader build is current
        run: node apps/pac-reader/build.mjs --check
      - name: Example bundle validates
        run: python3 plugins/policy-action-check/scripts/pac.py --space plugins/policy-action-check/examples/sample-service-terms validate
